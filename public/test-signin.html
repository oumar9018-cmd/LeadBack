<!doctype html>
<html><head><meta charset="utf-8"><title>signin-helper</title></head>
<body><p id="status">signing in...</p>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCX1lbzgXwdy3HPU-qFcix1O7X2FahXIFo",
    authDomain: "leadback-3345f.firebaseapp.com",
    projectId: "leadback-3345f",
    storageBucket: "leadback-3345f.firebasestorage.app",
    messagingSenderId: "469238593875",
    appId: "1:469238593875:web:a83795cfd62ace047409a6"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
</script>
<script>
  const token = decodeURIComponent(location.hash.slice(1));
  firebase.auth().signInWithCustomToken(token)
    .then(() => { document.getElementById('status').textContent = 'SIGNED IN as ' + (firebase.auth().currentUser ? firebase.auth().currentUser.email : '?'); setTimeout(() => { location.href = '/LeadBack/app'; }, 800); })
    .catch(e => { document.getElementById('status').textContent = 'SIGNIN ERROR: ' + e.message; });
</script>
</body></html>
